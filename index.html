    animation: grain .9s steps(6) infinite;

  @keyframes grain {
    0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); }
    60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); }

  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 46%, transparent 52%, rgba(0, 0, 0, .6)); }

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { FXAAShader } from "three/addons/shaders/FXAAShader.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

// ?still — служебный режим для превью: сразу готовый первый кадр, без заставки и анимаций
const still = location.search.includes("still");
const reduce = still || matchMedia("(prefers-reduced-motion: reduce)").matches;
const mobile = matchMedia("(max-width: 760px), (pointer: coarse)").matches;
// ── тестовые режимы для поиска мигания на ПК: ?test=1 / 2 / 3 / 13. Без параметра и на телефоне — всё как обычно ──
const TEST = mobile ? "" : (new URLSearchParams(location.search).get("test") || "");
const T_DIRECT = TEST.includes("1");    // 1 — рисуем сразу на экран, без промежуточного буфера (сглаживание делает браузер)
const T_FXAA = TEST.includes("2");      // 2 — буфер без 4× сглаживания, вместо него FXAA (диагностика)
const T_VSCROLL = TEST.includes("3");   // 3 — виртуальная прокрутка: страница стоит, колесо/клавиши двигают камеру
if ("scrollRestoration" in history) history.scrollRestoration = "manual";   // после обновления — всегда с первого экрана
scrollTo(0, 0);
document.documentElement.classList.add("locked");
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const R = 0.5;                                   // радиус мяча
const LAMP = new THREE.Vector3(0, 6.8, 0.6);     // прожектор

// ── рендер ──
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: T_DIRECT, powerPreference: "high-performance" });
// разрешение выбираем один раз при загрузке и больше не меняем — смена на ходу давала чёрный/разрезанный кадр.
// На больших экранах ограничиваем число пикселей (~5 Мп), на телефоне — как было.
const PR = mobile ? Math.min(devicePixelRatio, 1.6)
  : Math.max(1, Math.min(devicePixelRatio, 2, Math.sqrt(5.2e6 / (screen.width * screen.height))));
renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020306);
const camera = new THREE.PerspectiveCamera(28, 1, 0.3, 1200);
const RP = 30;                                   // радиус планеты: поле стоит на её макушке
const PLANET_C = new THREE.Vector3(0, -RP - 0.08, 0);   // на волосок ниже газона, чтобы они не мерцали друг сквозь друга
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: mobile || T_FXAA ? 0 : 4 }));
composer.setPixelRatio(PR);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.12, 0.5, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const fxaa = new ShaderPass(FXAAShader);
if (T_FXAA) composer.addPass(fxaa);

const U = {
  uTime: { value: 0 }, uLight: { value: 0 },
  uSpot: { value: new THREE.Vector2() }, uBall: { value: new THREE.Vector4(0, R, 0, R) },
  uPR: { value: PR },
  uBeam: { value: 1 }, uFade: { value: 1 }, uPool: { value: 2.5 },  // переход: луч, надпись, пятно света
  uShow: { value: 0 }, uPillar: { value: 0 }, uCurve: { value: 1 / (2 * RP) }               // планета: видимость и кривизна поля
};

// ── мяч: 12 пятиугольников + 20 шестиугольников, швы вдавлены, панели чуть выпуклые ──
function buildBall() {
  const phi = (1 + Math.sqrt(5)) / 2, ip = 1 / phi, C = [];
  for (const [a, b] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) C.push([0, a, b * phi], [a, b * phi, 0], [a * phi, 0, b]);
  for (const x of [1, -1]) for (const y of [1, -1]) for (const z of [1, -1]) C.push([x, y, z]);
  for (const [a, b] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) C.push([0, a * ip, b * phi], [a * ip, b * phi, 0], [a * phi, 0, b * ip]);
  const centers = C.map(c => new THREE.Vector3(...c).normalize());

  let g = new THREE.IcosahedronGeometry(1, mobile ? 48 : 72);
  g.deleteAttribute("normal"); g.deleteAttribute("uv");
  g = mergeVertices(g, 1e-5);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), v = new THREE.Vector3();
  const white = [0.86, 0.845, 0.80], red = [0.52, 0.018, 0.012], seamC = [0.05, 0.045, 0.04];
  // у усечённого икосаэдра шов лежит в 16,48° от центра пятиугольника и в 20,90° от центра шестиугольника
  const T5 = THREE.MathUtils.degToRad(16.48), T6 = THREE.MathUtils.degToRad(20.9);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let d1 = 9, d2 = 9, k = 0;
    for (let j = 0; j < 32; j++) {
      const d = Math.acos(Math.min(1, Math.max(-1, v.dot(centers[j])))) - (j < 12 ? T5 : T6);
      if (d < d1) { d2 = d1; d1 = d; k = j; } else if (d < d2) d2 = d;
    }
    const e = d2 - d1;
    const seam = 1 - sm(0.0, 0.026, e), puff = sm(0.0, 0.16, e);
    const rad = 1 + 0.011 * puff - 0.018 * seam;
    pos.setXYZ(i, v.x * rad, v.y * rad, v.z * rad);
    const base = k < 12 ? red : white;
    for (let c = 0; c < 3; c++) col[i * 3 + c] = base[c] + (seamC[c] - base[c]) * seam * 0.9;
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.MeshPhysicalMaterial({
    vertexColors: true, roughness: 0.4, metalness: 0, clearcoat: 0.7, clearcoatRoughness: 0.28, envMapIntensity: 0.4
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.scale.setScalar(R);
  return mesh;
}
const ball = buildBall();
ball.material.transparent = true;                // мяч рисуется после надписи — он перед ней
ball.renderOrder = 2;
scene.add(ball);

// ── свет ──
const spot = new THREE.SpotLight(0xfff0d8, 0, 0, 0.36, 0.6, 2);
spot.position.copy(LAMP);
scene.add(spot, spot.target);
const rim = new THREE.DirectionalLight(0x7d96ff, 0);
rim.position.set(-3, 2.2, -4);
scene.add(rim);
const hemi = new THREE.HemisphereLight(0x1d2b48, 0x030603, 0);
scene.add(hemi);

// ── газон: травинки (instanced) + земля под ними ──
const grassLight = `
  uniform vec2 uSpot; uniform float uLight, uPool, uShow; uniform vec4 uBall;
  // при отлёте край поля перекрашивается в цвет суши планеты — поле «врастает» в неё
  vec3 blendPlanet(vec3 c, vec2 p) { return mix(c, vec3(0.045, 0.075, 0.03), uShow * smoothstep(2.6, 5.2, length(p))); }
  float pool(vec2 p) { return 1.0 - smoothstep(0.25, uPool, length(p - uSpot)); }
  float contact(vec2 p) {
    float hgt = max(uBall.y - uBall.w, 0.0);
    float d = length(p - (uBall.xz + vec2(0.0, -0.09) * hgt));
    float s = mix(0.22, 1.0, smoothstep(uBall.w * (0.3 + hgt * 0.45), uBall.w * (1.05 + hgt * 0.9), d));
    return mix(1.0, s, 1.0 - smoothstep(0.0, 2.8, hgt));
  }
  float chalk(vec2 p) {                                   // центральный круг, средняя линия, центральная точка
    float w = 0.034;
    float c = 1.0 - smoothstep(w, w + 0.014, abs(length(p) - 1.85));
    c = max(c, 1.0 - smoothstep(w, w + 0.014, abs(p.y)));
    c = max(c, 1.0 - smoothstep(0.075, 0.09, length(p)));
    return c;
  }`;
{
  const N = mobile ? 34000 : 60000, RAD = 5.2;
  const blade = new THREE.PlaneGeometry(0.022, 1, 1, 5);
  blade.translate(0, 0.5, 0);
  const rnd = new Float32Array(N);
  const grass = new THREE.InstancedMesh(blade, new THREE.ShaderMaterial({
    uniforms: U, side: THREE.DoubleSide,
    vertexShader: `
      attribute float aRand;
      uniform float uTime, uCurve; uniform vec4 uBall;
      varying float vH; varying vec3 vW; varying float vR; varying vec2 vRoot;
      void main() {
        vec3 p = position; float h = uv.y;
        vRoot = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xz;
        p.x *= 1.0 - h * 0.85;
        vec4 w = modelMatrix * instanceMatrix * vec4(p, 1.0);
        float s = sin(uTime * 1.1 + w.x * 1.7 + w.z * 1.3 + aRand * 6.28) * 0.6 + sin(uTime * 2.4 + aRand * 12.0) * 0.25;
        w.x += s * 0.014 * h * h; w.z += s * 0.009 * h * h;
        vec2 d = w.xz - uBall.xz; float dl = length(d);
        float push = (1.0 - smoothstep(uBall.w * 0.25, uBall.w * 0.8, dl)) * (1.0 - smoothstep(0.0, 0.18, uBall.y - uBall.w));
        w.xz += d / max(dl, 1e-4) * push * 0.06 * h; w.y -= push * 0.035 * h;
        vH = h; vW = w.xyz; vR = aRand;
        w.y -= dot(w.xz, w.xz) * uCurve;                                  // поле повторяет кривизну планеты
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: grassLight + `
      varying float vH; varying vec3 vW; varying float vR; varying vec2 vRoot;
      void main() {
        if (length(vRoot) > mix(6.0, 2.3, uShow) - 0.5 * vR) discard;   // при отлёте вокруг стадиона видна Земля
        vec3 root = vec3(0.006, 0.02, 0.005);
        vec3 tip = mix(vec3(0.05, 0.16, 0.03), vec3(0.13, 0.27, 0.05), vR);
        vec3 c = mix(root, tip, smoothstep(0.0, 1.0, vH));
        c *= 0.86 + 0.14 * step(0.5, fract(vW.x * 0.42 + 0.21));           // полосы стрижки
        c = mix(c, vec3(0.42, 0.43, 0.39) * (0.35 + 0.65 * vH), chalk(vRoot) * 0.9);
        float L = pool(vW.xz);
        vec3 lit = c * (0.035 + 2.8 * L * L * uLight) * contact(vW.xz);
        float hh = clamp(vH, 0.0, 1.0);                                       // pow от отрицательного = NaN на Metal

function thump(power, kick) {

  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(kick ? 150 : 95, t);
  o.frequency.exponentialRampToValueAtTime(kick ? 48 : 38, t + 0.14);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.min(0.7, 0.12 + power * 0.13), t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (kick ? 0.24 : 0.18));
  o.connect(g).connect(out); o.start(t); o.stop(t + 0.26);
  const n = Math.floor(actx.sampleRate * 0.06), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), ng = actx.createGain();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = kick ? 1900 : 900; f.Q.value = 0.8;
  ng.gain.value = Math.min(0.35, 0.06 + power * 0.06) * (kick ? 1 : 0.6);
  src.connect(f).connect(ng).connect(out); src.start(t);
}

let W = 1, H = 1, portrait = false;
const tmp = new THREE.Vector3();
const toPx = (x, y, z) => { tmp.set(x, y, z).project(camera); return { x: (tmp.x + 1) / 2 * W, y: (1 - tmp.y) / 2 * H }; };
function drawText() {
  // чёткость надписи: в пикселях экрана (с учётом Retina), но не больше предела текстуры видеокарты
  const k = Math.min(renderer.getPixelRatio(), Math.min(8192, renderer.capabilities.maxTextureSize) / W);
  const cw = Math.round(W * k), ch = Math.round(H * k);
  if (cw !== tCanvas.width || ch !== tCanvas.height) {
    tCanvas.width = cw; tCanvas.height = ch;
    tTex.dispose();                     // размер изменился (окно развернули) — старую текстуру на видеокарте выбрасываем
  }
  const ctx = tctx; ctx.setTransform(k, 0, 0, k, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  const c = toPx(0, R, 0), top = toPx(0, 2 * R, 0), rpx = c.y - top.y;
  const font = s => `900 ${s}px Unbounded`;
  if (portrait) {
    const fs = Math.min(W * 0.33, H * 0.17), cap = fs * 0.73;
    ctx.font = font(fs); ctx.letterSpacing = `${-fs * 0.04}px`; ctx.textAlign = "center";
    const b2 = top.y - fs * 0.16, b1 = b2 - cap - fs * 0.14;
    ctx.fillText("ФК", W / 2, b1); ctx.fillText("РЭУ", W / 2, b2);
  } else {
    let fs = rpx * 2.6;
    const gap = rpx * 2.7;                          // зазор под мяч не сжимаем — уменьшаем только шрифт
    ctx.font = font(fs); ctx.letterSpacing = `${-fs * 0.04}px`;
    // мяч в центре, а «РЭУ» шире «ФК» — запас считаем по более длинной половине
    const half = Math.max(ctx.measureText("ФК").width, ctx.measureText("РЭУ").width);
    const room = W / 2 - gap / 2 - W * 0.06;
    if (half > room) fs *= Math.max(0.3, room / half);
    ctx.font = font(fs); ctx.letterSpacing = `${-fs * 0.04}px`;
    const base = c.y + fs * 0.73 / 2;
    ctx.textAlign = "right"; ctx.fillText("ФК", c.x - gap / 2, base);
    ctx.textAlign = "left"; ctx.fillText("РЭУ", c.x + gap / 2, base);
  }
  tTex.needsUpdate = true;
}

const HERO = { pos: new THREE.Vector3(), look: new THREE.Vector3(), r: 1, el: 0 };
const TOP = { look: new THREE.Vector3(0, 0.45, 0.2), r: 10.5, el: THREE.MathUtils.degToRad(82), az: 0.62 };
const FAR = { r: 190, el: THREE.MathUtils.degToRad(28) };     // финал: вся планета в кадре
const look = new THREE.Vector3();
const easeIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function placeCamera(P, mx, my) {

  let r = HERO.r + (TOP.r - HERO.r) * a;
  let el = HERO.el + (TOP.el - HERO.el) * a;
  let az = TOP.az * a;
  // сначала отлетаем, держа поле в центре, и только потом переводим взгляд на центр планеты
  if (b > 0) { look.lerp(PLANET_C, b * b); r += (FAR.r - r) * b; el += (FAR.el - el) * b; az += Math.PI * 2 * b; }
  el += my * 0.012 * (1 - a); az += mx * 0.022 * (1 - a);   // лёгкий параллакс только у газона
  camera.position.set(look.x + r * Math.cos(el) * Math.sin(az), look.y + r * Math.sin(el), look.z + r * Math.cos(el) * Math.cos(az));
  camera.lookAt(look);
  // в финале планета уходит вправо (на телефоне — вниз), чтобы не стоять за «С 2010 года»
  if (b > 0.001) camera.setViewOffset(W, H, portrait ? 0 : -W * 0.17 * b * b, portrait ? -H * 0.12 * b * b : 0, W, H);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  // надпись всегда в одном месте экрана — её не срежет ни газон, ни край поля
  camera.getWorldDirection(tmp);
  textPlane.position.copy(camera.position).addScaledVector(tmp, TEXT_D);
  textPlane.quaternion.copy(camera.quaternion);
}
const TEXT_D = 8;

function layout() {
  W = innerWidth; H = innerHeight; portrait = W / H < 0.85;
  renderer.setSize(W, H, false);
  if (!T_DIRECT) { composer.setSize(W, H); bloom.setSize(W, H); }
  fxaa.material.uniforms.resolution.value.set(1 / (W * renderer.getPixelRatio()), 1 / (H * renderer.getPixelRatio()));
  camera.aspect = W / H;
  // первый кадр — низко у газона; финал прокрутки — сверху над центральным кругом
  if (portrait) { camera.fov = 34; HERO.pos.set(0, 1.25, 8.8); HERO.look.set(0, 1.75, 0); TOP.r = 12.5; }
  else { camera.fov = 28; HERO.pos.set(0, 0.95, 6.8); HERO.look.set(0, 0.62, 0); TOP.r = 10.5; }
  if (portrait) { TOP.r = 17; FAR.r = 280; } else FAR.r = 190;
  const v = HERO.pos.clone().sub(HERO.look);
  HERO.r = v.length(); HERO.el = Math.asin(v.y / HERO.r);
  camera.updateProjectionMatrix();
  placeCamera(0, 0, 0);
  const ph = 2 * TEXT_D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  textPlane.scale.set(ph * camera.aspect, ph, 1);
  drawText();
}

// ── физика мяча и управление ──
const st = {
  p: new THREE.Vector3(0, 60, 0), v: new THREE.Vector3(), w: new THREE.Vector3(0, 0.25, 0),
  spawned: false, juggles: 0, best: 0, resting: true
};
const ui = document.getElementById("ui"), score = document.getElementById("score");
function showScore() {
  score.innerHTML = st.juggles > 0
    ? `Чеканка <b>${st.juggles}</b><br>Рекорд ${st.best}`
    : st.best > 0 ? `Рекорд <b>${st.best}</b><br>Нажми на мяч` : "Нажми на мяч<br>Потяни — закрутишь";
}
function kick() {
  if (!st.spawned) return;
  st.v.y = Math.max(st.v.y, 0) * 0.3 + 3.3 + Math.random() * 0.7;
  st.v.x += (Math.random() - 0.5) * 0.7 - st.p.x * 0.9;
  st.v.z += (Math.random() - 0.5) * 0.3 - st.p.z * 0.9;
  st.w.x = -7 - Math.random() * 5; st.w.y += (Math.random() - 0.5) * 5; st.w.z = (Math.random() - 0.5) * 3;
  st.juggles++; st.best = Math.max(st.best, st.juggles); st.resting = false;
  thump(2.2, true);
  showScore();
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), mouse = new THREE.Vector2(0, 0);
const overBall = e => {
  ndc.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.distanceToPoint(st.p) < R * 1.2;
};
let drag = null;
canvas.addEventListener("pointerdown", e => {
  if (!overBall(e)) return;
  drag = { x: e.clientX, y: e.clientY, moved: 0 };
  canvas.setPointerCapture(e.pointerId);
  document.body.classList.add("grabbing");
});
addEventListener("pointermove", e => {
  mouse.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.hypot(dx, dy); drag.x = e.clientX; drag.y = e.clientY;
    st.w.y += dx * 0.05; st.w.x += dy * 0.05;
  } else document.body.classList.toggle("grab", overBall(e));
});
addEventListener("pointerup", () => {
  if (drag && drag.moved < 8) kick();
  drag = null; document.body.classList.remove("grabbing");
});

const dq = new THREE.Quaternion(), axis = new THREE.Vector3(), spotXZ = new THREE.Vector2();
function physics(dt) {
  if (!st.spawned) return;
  st.v.y -= 9.8 * 0.82 * dt;
  st.v.x += -st.p.x * 2.6 * dt; st.v.z += -st.p.z * 2.6 * dt;
  st.v.x *= 1 - 0.7 * dt; st.v.z *= 1 - 0.7 * dt;
  st.p.addScaledVector(st.v, dt);
  if (st.p.y < R) {
    st.p.y = R;
    if (st.v.y < -0.7) { landed(-st.v.y); st.v.y = -st.v.y * 0.46; st.w.multiplyScalar(0.7); }
    else {
      st.v.y = 0;
      if (st.juggles) { st.juggles = 0; showScore(); }
      st.resting = true;
    }
  }
  const ground = st.p.y <= R + 1e-3;
  if (ground) { st.w.z += (-st.v.x / R - st.w.z) * Math.min(1, dt * 8); st.w.x += (st.v.z / R - st.w.x) * Math.min(1, dt * 3); }
  st.w.multiplyScalar(1 - (ground ? 1.2 : 0.1) * dt);
  if (ground && !drag && !reduce) st.w.y += (0.22 - st.w.y) * dt * 0.8;   // медленно поворачивается на месте
  const sp = st.w.length();
  if (sp > 1e-4) { dq.setFromAxisAngle(axis.copy(st.w).divideScalar(sp), sp * dt); ball.quaternion.premultiply(dq); }
  ball.position.copy(st.p);
}

// заставка: прожектор мигает и разгорается, мяч падает в луч, надпись проявляется
function lampLevel(t) {
  if (reduce) return 1;
  return sm(0.3, 2.0, t);                          // свет плавно разгорается
}


// загрузчик: показанный процент плавно догоняет настоящий, но не быстрее, чем за ~1,4 с — чтобы наполнение было видно
const loader = document.getElementById("loader"), ldWave = document.getElementById("ldWave"), ldText = document.getElementById("ldText");
let shownLoad = 0, loaderDone = false, loaderDoneAt = 0, wavePhase = 0;
if (still) { loader.remove(); loaderDone = true; loaderDoneAt = -1e9; }   // для превью — сразу готовый кадр
function updateLoader(dt) {
  if (loaderDone) return;
  // между файлами процент плавно ползёт к следующему (до 90% шага), чтобы мячик наполнялся без рывков
  const creep = 0.9 * (1 - Math.exp(-(performance.now() - earthLastAt) / 1600));
  const real = earthReady ? 1 : Math.min(0.97, (earthLoaded + creep) / earthTotal);
  shownLoad = Math.min(shownLoad + Math.max(0, real - shownLoad) * Math.min(1, dt * 4), shownLoad + dt / 1.4, 1);
  wavePhase += dt * 3;
  const y = 40 - 40 * shownLoad, a = 1.6 * (1 - shownLoad * 0.6);   // уровень «жидкости» и высота волны
  let d = `M0 ${y}`;
  for (let x = 0; x <= 40; x += 2) d += ` L${x} ${(y + Math.sin(x * 0.35 + wavePhase) * a).toFixed(2)}`;
  ldWave.setAttribute("d", d + " L40 41 L0 41 Z");
  ldText.textContent = `Загрузка · ${Math.round(shownLoad * 100)}%`;
  if (shownLoad >= 0.999 && earthReady) { loaderDone = true; loaderDoneAt = performance.now(); setTimeout(() => loader.classList.add("done"), 250); }
}

let t = 0, t0 = 0, last = performance.now(), uiShown = false;
let P = 0, Ptarget = 0;
const mouseS = new THREE.Vector2(), ZERO2 = new THREE.Vector2();
const outro = document.getElementById("outro"), cue = document.getElementById("cue"), league = document.getElementById("league");
const scrollFor = p => p * innerHeight * 1.6;
let vPos = 0;                                          // позиция виртуальной прокрутки (режим 3), 0..1
const readScroll = () => {
  if (document.documentElement.classList.contains("locked")) {   // пока грузится — всегда первый экран
    if (scrollY > 0) scrollTo(0, 0);
    vPos = 0; Ptarget = 0; return;
  }
  Ptarget = Math.min(1, Math.max(0, T_VSCROLL ? vPos : scrollY / (innerHeight * 1.6)));
  if (!earthReady) Ptarget = Math.min(Ptarget, 0.36);  // Земля ещё грузится — дальше вида над полем не пускаем
};
let Pv = 0;                                            // скорость камеры: переход едет за прокруткой как на пружине
addEventListener("scroll", readScroll, { passive: true });
if (T_VSCROLL) {
  document.documentElement.classList.add("vscroll");
  addEventListener("wheel", e => {
    e.preventDefault();
    const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? innerHeight : 1;
    vPos = Math.min(1, Math.max(0, vPos + e.deltaY * k / (innerHeight * 1.6)));
    readScroll();
  }, { passive: false });
  addEventListener("keydown", e => {
    const step = { ArrowDown: 0.06, ArrowUp: -0.06, PageDown: 0.25, PageUp: -0.25, " ": 0.25, End: 1, Home: -1 }[e.key];
    if (step === undefined) return;
    e.preventDefault(); vPos = Math.min(1, Math.max(0, vPos + step)); readScroll();
  });
}
if (TEST) {                                            // метка режима, чтобы не перепутать вкладки
  const b = document.createElement("div");
  b.textContent = "ТЕСТ " + TEST;
  b.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;padding:6px 12px;border-radius:999px;background:#c8201a;color:#fff;font:700 12px Manrope,sans-serif;letter-spacing:.12em";
  document.body.appendChild(b);
}
function frame(now) {
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(raw, 1 / 24); last = Math.max(last, now);
  t = reduce ? 10 : (now - t0) / 1000;            // заставка идёт по часам, а не по кадрам
  U.uTime.value += dt;
  const L = lampLevel(t);
  U.uLight.value = L;
  spot.intensity = 80 * L; rim.intensity = 1.5 * L; hemi.intensity = 0.3 * L;
  ball.material.envMapIntensity = 0.4 * L;

  if (!st.spawned && t > (reduce ? 0 : 1.15)) {
    st.spawned = true;
    if (reduce) st.p.set(0, R, 0); else { st.p.set(0.15, 4.4, -0.1); st.v.set(-0.12, -1.2, 0.08); st.w.set(-6, 0.8, 0.5); }
  }
  physics(dt);
  ball.visible = st.spawned;
  textMat.uniforms.uReveal.value = reduce ? 1 : sm(1.7, 3.1, t);
  if (!uiShown && t > 2.6) { ui.classList.add("on"); uiShown = true; }

  // прокрутка: камера-кран поднимается над центральным кругом
  // пружина почти без перехлёста: камера мягко разгоняется и плавно тормозит, без рывков
  Pv += (Ptarget - P) * 16 * dt; Pv *= Math.exp(-8.5 * dt); P += Pv * dt;
  if (Math.abs(Ptarget - P) < 1e-4 && Math.abs(Pv) < 1e-4) { P = Ptarget; Pv = 0; }
  const e = easeIO(Math.min(1, P / 0.35));
  mouseS.lerp(reduce ? ZERO2 : mouse, Math.min(1, dt * 3));
  placeCamera(P, mouseS.x, mouseS.y);
  U.uBeam.value = 1 - sm(0.04, 0.22, P);            // конус луча гаснет, пока камера поднимается над ним
  U.uFade.value = 1 - sm(0.02, 0.2, P);
  U.uPool.value = 2.5 + 0.9 * e;
  U.uShow.value = sm(0.3, 0.7, P);
  U.uPillar.value = sm(0.62, 0.9, P);                // луч — когда камера уже далеко и смотрит сбоку
  spin += dt * 0.012;                                // Земля медленно вращается вокруг оси через Москву
  planet.quaternion.copy(spinQ.setFromAxisAngle(UP, spin)).multiply(MOSCOW);
  earthU.uCloudShift.value = (earthU.uCloudShift.value + dt * 0.0015) % 1;
  outro.style.opacity = sm(0.78, 0.97, P);
  outro.classList.toggle("live", P > 0.9);            // ссылка кликабельна, только когда финал виден
  outro.style.transform = `translateY(${(1 - sm(0.78, 1, P)) * 30}px)`;
  // «Листай» проявляется, когда мячик-загрузчик уже погас
  cue.style.opacity = loaderDone ? sm(1100, 1600, performance.now() - loaderDoneAt) * (1 - sm(0, 0.08, P)) : 0;
  updateLoader(Math.min(raw, 0.1));
  if (loaderDone && t > 2.4 && document.documentElement.classList.contains("locked")) document.documentElement.classList.remove("locked");                 // по реальному времени, а не по числу кадров
  score.style.opacity = 1 - sm(0.25, 0.4, P);
  league.style.opacity = 1 - sm(0.6, 0.8, P);

  // свет чуть следует за курсором и за мячом (на виде сверху — только за мячом)
  const follow = 1 - e;
  spotXZ.lerp(new THREE.Vector2(mouse.x * 0.45 * follow + st.p.x * 0.4, -mouse.y * 0.28 * follow + st.p.z * 0.4), Math.min(1, dt * 2.5));
  U.uSpot.value.copy(spotXZ);
  spot.target.position.set(spotXZ.x, 0, spotXZ.y);
  tmp.set(spotXZ.x, 0, spotXZ.y).sub(LAMP).normalize();
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), tmp);
  U.uBall.value.set(st.p.x, st.spawned ? st.p.y : 60, st.p.z, R);

  if (T_DIRECT) renderer.render(scene, camera); else composer.render();
  if (t > 4 && raw < 0.5) adaptQuality(raw);         // паузы (вкладка в фоне) не считаем
  requestAnimationFrame(frame);
}

// автокачество: если кадров стабильно мало, по шагам снижаем разрешение, густоту травы и свечение
const grassMesh = scene.children.find(o => o.isInstancedMesh);
const quality = { acc: 0, n: 0, step: 0 };
function adaptQuality(dt) {
  if (document.hidden || quality.step > 1) return;
  quality.acc += dt; quality.n++;
  if (quality.acc < 2) return;
  const fps = quality.n / quality.acc; quality.acc = 0; quality.n = 0;
  if (fps > 40) return;
  quality.step++;
  if (quality.step === 1) grassMesh.count = Math.floor(grassMesh.count * 0.55);   // без смены размера холста — не мигает
  if (quality.step === 2) bloom.enabled = false;
}
addEventListener("resize", layout);
const fontsReady = Promise.race([
  Promise.all([document.fonts.load("900 120px Unbounded", "ФК РЭУ"), document.fonts.load("600 12px Manrope", "Сезон")]),
  new Promise(r => setTimeout(r, 2500))
]);
fontsReady.then(() => {
  scrollTo(0, 0);
  layout(); readScroll(); P = Ptarget;
  last = t0 = performance.now();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
